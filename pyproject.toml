[project]
name = "semseg"
version = "0.1.0"
description = "Semantic segmentation of NAIP 0.5 m imagery on the Annual NLCD 30 m grid"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "segment-geospatial[samgeo2,text]==1.4.2",
    "torch>=2.9",
    "torchvision",
    "pyyaml",
    "rasterio",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semseg"]

# PyTorch for the GB10 (aarch64, Blackwell sm_121): CUDA 13 wheels from the PyTorch index
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
