# Data registry: one [[dataset]] table for each data set. Rules: docs/DATA_STANDARD.md.
# Check (from the repository root):
#   python3 ~/.claude/skills/project-plan/scripts/registry_check.py data/REGISTRY.toml --plan PLAN.md
# status: present (must exist now), planned (a stage will write it), retired (kept for the record)
# Exit code 3 = a root does not exist: the lab share is not mounted. Stop; do not write the data elsewhere.

[roots]
share = "/run/user/1001/gvfs/smb-share:server=100.102.218.98,share=lab/data"
semseg = "{share}/usace-landuse-semseg"                  # this project: read and write (DS-23)
fgt = "{share}/usace-landuse/fine_grid_test"             # fine_grid data: read only
stack = "~/workspace/usace-landuse/USACE/01_Data/stack"  # usace-landuse 30 m stack: read only
repo = "."                                               # this repository (run the check from its root)

# ---- inputs that exist now (read only) ----

[[dataset]]
id = "naip_2022"
title = "NAIP 2022 chunks, 0.5 m, 5 bands (red, green, blue, nir, source_rank)"
path = "{fgt}/{pid}/naip/r*_c*.tif"
kind = "raster"
status = "present"
min_files = 384            # 77: 157, 392: 227 (2026-11-11)
writer = "external"
readers = ["1.2", "1.3", "2.2", "4.3", "4.4"]
source = "Planetary Computer `naip`, fetched by usace-landuse fine_grid step 1 (2026-11-11)"
standard = "DS-3, DS-4, DS-5"
updated = "2026-11-11"

[[dataset]]
id = "fg_chunks"
title = "fine_grid chunk lists (chunk, row, col, bounds, footprint share)"
path = "{fgt}/{pid}/chunks.csv"
kind = "table"
status = "present"
min_files = 2
writer = "external"
readers = ["1.1"]
source = "usace-landuse fine_grid grid.py"
standard = "DS-3, DS-7"
updated = "2026-11-11"

[[dataset]]
id = "lidar_hag"
title = "3DEP lidar height above ground, class, year (2 m)"
path = "{fgt}/{pid}/lidar/r*_c*.tif"
kind = "raster"
status = "present"
min_files = 384
writer = "external"
readers = ["4.2", "4.3"]
source = "Planetary Computer `3dep-lidar-hag`, `3dep-lidar-classification`; years >= 2014"
standard = "DS-1, DS-3"
notes = "392: only 115 of 227 chunks have data"
updated = "2026-11-11"

[[dataset]]
id = "meta_chm"
title = "Meta / WRI 1 m canopy height"
